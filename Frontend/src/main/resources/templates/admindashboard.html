<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; background-color: #f1f5f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .admin-banner { background: #1e293b; color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
        .metric-card { background: #f8fafc; padding: 20px; border-radius: 6px; text-align: center; border: 1px solid #e2e8f0; border-top: 5px solid #1e293b; }
        .metric-card h4 { margin: 0; color: #64748b; font-size: 14px; text-transform: uppercase; }
        .metric-card p { margin: 10px 0 0 0; font-size: 24px; font-weight: bold; color: #0f172a; }
        .menu-section { margin-top: 30px; background: #fff; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; }
        .menu-item { background: #f8fafc; padding: 12px; margin: 8px 0; border-radius: 5px; text-align: center; font-weight: bold; border: 1px solid #cbd5e1; }
        a { text-decoration: none; color: #1e293b; display: block; }
        a:hover { color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ Admin Configuration Console</h2>
    <div class="admin-banner">
        வணக்கம் அட்மின்: <span th:text="${adminName}">Admin</span>
    </div>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <h4>Total Registered Students</h4>
            <p th:text="${totalStudentsCount}">0</p>
        </div>
        <div class="metric-card">
            <h4>Total Assessment Questions</h4>
            <p th:text="${totalQuestionsCount}">0</p>
        </div>
    </div>

    <div class="menu-section">
        <h3>🔧 Configuration & Controls</h3>
        <div class="menu-item">
            <a href="/admin/questions">📝 Manage Questions (கேள்விகளை நிர்வகி)</a>
        </div>
        <div class="menu-item">
            <a href="/admin/roles">🎯 Create Target Roles (வேலை வாய்ப்புகளை உருவாக்கு)</a>
        </div>
        <div class="menu-item" style="background: #fef2f2;">
            <a href="/logout" style="color: #dc3545;">🚪 Logout (வெளியேறு)</a>
        </div>
    </div>
</div>

</body>
</html>
