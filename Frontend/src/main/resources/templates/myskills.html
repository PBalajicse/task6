<!DOCTYPE html>
<html lang="ta" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills - Manage Skills</title>
    <!-- டிசைன் அழகாக இருக்க Bootstrap CSS & Icons -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            background-color: #212529;
            min-height: 100vh;
            color: white;
        }
        .sidebar a {
            color: #adbdcc;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
            color: white;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- இடது பக்க மெனு பார் (Sidebar Navigation) -->
            <div class="col-md-3 col-lg-2 sidebar p-3">
                <h4 class="text-center fw-bold text-primary mb-4 py-2 border-bottom border-secondary">Skill Analyzer</h4>
                <nav class="nav flex-column">
                    <a href="/dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="/my-skills" class="active"><i class="bi bi-person-gear me-2"></i> My Skills</a>
                    <a href="/assessment"><i class="bi bi-journal-check me-2"></i> Take Assessment</a>
                    <a href="/history"><i class="bi bi-clock-history me-2"></i> Assessment History</a>
                    <hr class="border-secondary my-3">
                    <a href="/" class="text-danger mt-auto"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
                </nav>
            </div>

            <!-- வலது பக்க முதன்மை UI பகுதி (Main Content Area) -->
            <div class="col-md-9 col-lg-10 p-4">
                <h2 class="fw-bold text-dark mb-4"><i class="bi bi-person-gear text-primary me-2"></i> My Skills</h2>

                <div class="row g-4">
                    <!-- 1. UI Form: புதிய திறமைகளைச் சேர்க்கும் பகுதி (Add Skill Form) -->
                    <div class="col-lg-4">
                        <div class="card card-custom p-4 bg-white shadow-sm">
                            <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-plus-circle me-1"></i> Add New Skill</h5>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Select Skill (திறமை)</label>
                                    <select class="form-select" required>
                                        <option value="">-- Choose Skill --</option>
                                        <option>Java</option>
                                        <option>Python</option>
                                        <option>Spring Boot</option>
                                        <option>MySQL</option>
                                        <option>HTML / CSS</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Skill Level (திறமை நிலை)</label>
                                    <select class="form-select" required>
                                        <option>Beginner (தொடக்க நிலை)</option>
                                        <option>Intermediate (நடுத்தர நிலை)</option>
                                        <option>Expert (உயர் நிலை)</option>
                                    </select>
                                end
                                <button type="button" class="btn btn-primary w-100 fw-bold" onclick="alert('UI Alert: புது திறமை சேர்க்கப்பட்டது!')">
                                    <i class="bi bi-plus-lg me-1"></i> Add Skill
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- 2. UI Table: திறமைகளின் பட்டியல் மற்றும் நீக்கும் பட்டன் (Skills List & Remove) -->
                    <div class="col-lg-8">
                        <div class="card card-custom p-4 bg-white shadow-sm">
                            <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-list-stars me-1"></i> Current Skills Inventory</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Skill Name</th>
                                            <th>Proficiency Level</th>
                                            <th class="text-center">Action (நீக்கு)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><strong>Java</strong></td>
                                            <td><span class="badge bg-info text-dark">Intermediate</span></td>
                                            <td class="text-center">
                                                <button class="btn btn-sm btn-outline-danger" onclick="alert('UI Alert: இந்த திறமை நீக்கப்பட்டது!')"><i class="bi bi-trash"></i> Remove</button>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><strong>Spring Boot</strong></td>
                                            <td><span class="badge bg-secondary">Beginner</span></td>
                                            <td class="text-center">
                                                <button class="btn btn-sm btn-outline-danger" onclick="alert('UI Alert: இந்த திறமை நீக்கப்பட்டது!')"><i class="bi bi-trash"></i> Remove</button>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td><strong>HTML / CSS</strong></td>
                                            <td><span class="badge bg-success">Expert</span></td>
                                            <td class="text-center">
                                                <button class="btn btn-sm btn-outline-danger" onclick="alert('UI Alert: இந்த திறமை நீக்கப்பட்டது!')"><i class="bi bi-trash"></i> Remove</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
