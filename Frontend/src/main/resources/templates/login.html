<!DOCTYPE html>
<html lang="ta" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Authenticate</title>
    <!-- டிசைன் அழகாக இருக்க Bootstrap CSS லிங்க் -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background-color: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- தலைப்பு -->
        <h2 class="fw-bold text-success mb-2 text-start">Student Login</h2>
        <p class="text-muted small mb-4 text-start">உங்கள் கணக்கில் உள்நுழைய விவரங்களை உள்ளிடவும்</p>

        <!-- 🔥 முக்கியமானது: லாகின் ஃபார்ம் இப்போ சப்மிட் பண்ணா பேக்-எண்ட் /login வழியே பிராசஸ் ஆகும் -->
        <form th:action="@{/login}" method="post">
            
            <!-- 1. Username Input -->
            <div class="mb-3 text-start">
                <label for="username" class="form-label fw-semibold">Email / Username</label>
                <!-- class="form-control" மற்றும் name="username" சேர்த்துள்ளோம் -->
                <input type="text" class="form-control" id="username" name="username" placeholder="உள்நுழைவுப் பெயரை உள்ளிடவும்" required>
            </div>

            <!-- 2. Password Input -->
            <div class="mb-3 text-start">
                <label for="password" class="form-label fw-semibold">Password (கடவுச்சொல்)</label>
                <!-- class="form-control" மற்றும் name="password" சேர்த்துள்ளோம் -->
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <!-- 3. Login Button (அழகான பெரிய பட்டன்) -->
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg fw-bold">Login (உள்நுழை)</button>
            </div>
        </form>

        <!-- ரிஜிஸ்டர் பக்க லிங்க் -->
        <div class="mt-4 text-start">
            <p class="text-muted small mb-0">புதிய கணக்கு உருவாக்க வேண்டுமா? <a href="/register" class="text-success fw-bold text-decoration-none">Register Here</a></p>
        </div>
    </div>

</body>
</html>
